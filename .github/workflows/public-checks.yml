name: Public checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover components and check tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      components: ${{ steps.inventory.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Check repository tooling
        run: |
          uv run --locked ruff check scripts tests
          uv run --locked ruff format --check scripts tests
          uv run --locked python -m unittest discover -s tests
          bash -n scripts/import-image.sh
      - name: Select components to check
        id: inventory
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # For pull requests, compare the checked-out merge commit with its base parent.
          args=()
          if [[ -n "$BASE" ]]; then
            if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              args+=(--changed-from "$BASE")
            else
              echo "::notice::Diff base unavailable. Checking all components."
            fi
          fi
          components=$(python3 scripts/components.py matrix "${args[@]}")
          echo "components=$components" >> "$GITHUB_OUTPUT"

  build:
    name: Check ${{ matrix.component }}
    needs: discover
    if: needs.discover.outputs.components != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install Skopeo
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
      - name: Prepare component artifacts
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 scripts/components.py build "$COMPONENT"

  required:
    name: Public checks passed
    if: always()
    needs: [discover, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
          COMPONENTS: ${{ needs.discover.outputs.components }}
        run: |
          test "$DISCOVER" = success
          if [[ "$COMPONENTS" == '[]' ]]; then
            test "$BUILD" = skipped
          else
            test "$BUILD" = success
          fi
