name: Publish accelerator image
on:
  push:
    tags: ['release/*/*/v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Existing project release tag (name or refs/tags/...)
        required: true
        type: string

env:
  RELEASE_REF: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

permissions: {}

jobs:
  preflight:
    name: Check publication eligibility
    if: >-
      github.repository == 'dynamia-ai/accelerator-artifacts'
      && ((github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/release/'))
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      component: ${{ steps.resolve.outputs.component }}
      release-ref: ${{ steps.resolve.outputs.release-ref }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - id: resolve
        run: python3 scripts/release.py --check --github-output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_ENABLED: ${{ vars.PUBLIC_RELEASE_ENABLED }}

  release:
    name: Publish ${{ needs.preflight.outputs.component }}
    needs: preflight
    concurrency:
      group: publish-${{ needs.preflight.outputs.component }}
      queue: max
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      release-ref: ${{ needs.preflight.outputs.release-ref }}
      environment: ${{ needs.preflight.outputs.environment }}
