name: Upstream releases
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-releases
  cancel-in-progress: false

jobs:
  check:
    name: Discover release upgrades
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'dynamia-ai/accelerator-artifacts' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python3 scripts/upstream.py poll
        env:
          GH_TOKEN: ${{ github.token }}

  update:
    name: Open upstream update PRs
    needs: check
    if: >-
      ${{ !cancelled() && github.repository == 'dynamia-ai/accelerator-artifacts'
        && github.ref == 'refs/heads/main' && vars.UPSTREAM_WRITE_ENABLED == 'true'
        && vars.UPSTREAM_SIGNING_DCO_VERIFIED == 'true' }}
    environment: upstream-writer
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.UPSTREAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
          owner: dynamia-ai
          repositories: accelerator-artifacts
          permission-contents: write
          permission-pull-requests: write
      - name: Recheck main and open missing PRs
        run: python3 scripts/upstream.py poll --write
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_APP_TOKEN: ${{ steps.app.outputs.token }}
          UPSTREAM_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          UPSTREAM_WRITE_ENABLED: ${{ vars.UPSTREAM_WRITE_ENABLED }}
          UPSTREAM_SIGNING_DCO_VERIFIED: ${{ vars.UPSTREAM_SIGNING_DCO_VERIFIED }}
