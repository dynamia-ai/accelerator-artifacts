[project]
name = "accelerator-artifacts"
version = "0.1.0"
description = "Version tracking and image release tooling for accelerator components"
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = []

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Tests add the standalone scripts directory to sys.path before importing it.
"tests/test_*.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
