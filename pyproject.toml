[project]
name = "accelerator-artifacts"
version = "0.1.0"
description = "Build and publish accelerator component artifacts"
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = []

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
